<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>생애 첫 국민연금 지원 대상 확인 | 생활ZIP</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#172033;font-family:system-ui,'Malgun Gothic',sans-serif;line-height:1.65}main{max-width:660px;margin:24px auto;padding:26px;background:white;border:1px solid #dce3eb;border-radius:20px}header{text-align:center;border-bottom:1px solid #e2e8f0;padding-bottom:18px}h1{font-size:26px;line-height:1.35;margin:8px 0}p{margin:8px 0}.brand{font-weight:800;color:#2563eb}.muted,small{color:#64748b;font-size:13px}fieldset{border:0;border-bottom:1px solid #e2e8f0;padding:18px 0;margin:0}legend{float:left;width:100%;font-weight:700;margin-bottom:12px}select{width:100%;padding:12px;border:1px solid #b9c5d6;border-radius:9px;background:white;font:inherit;color:inherit}.choices{display:flex;gap:12px;clear:both}.choices label{flex:1;border:1px solid #cbd5e1;padding:10px;border-radius:10px;cursor:pointer}.choices label:has(input:checked){background:#eff6ff;border-color:#2563eb}input{accent-color:#2563eb}button,.link{display:block;width:100%;font:inherit;font-weight:700;text-align:center;border:0;border-radius:10px;padding:14px;margin-top:14px;background:#2563eb;color:white;text-decoration:none;cursor:pointer}button.secondary{background:#fff;color:#334155;border:1px solid #cbd5e1}#result{margin-top:20px;border:1px solid #cbd5e1;border-radius:12px;padding:20px;text-align:center}#headline{font-size:24px;font-weight:800;color:#2563eb}#amount{font-size:30px;font-weight:800;color:#087e52}footer{margin-top:20px;font-size:13px;color:#64748b}footer a{color:#2563eb} @media(max-width:700px){main{margin:10px;padding:18px}h1{font-size:23px}}
</style></head><body><main><header><div class="brand">생활ZIP · 알짜정보</div><h1>우리 자녀도 지원받을 수 있을까?</h1><p>생애 첫 국민연금 지원 대상 간편 확인</p><small>2026년 11월 27일 기준 안내</small></header><form id="check"><fieldset><legend>① 자녀의 출생연도</legend><select id="year" required><option value="">출생연도를 선택하세요</option><option value="old">2008년 이전 출생</option></select></fieldset><div id="questions"></div><button type="submit">지원 대상 확인하기</button><button type="reset" class="secondary">다시 확인하기</button></form><section id="result" hidden aria-live="polite" tabindex="-1"><div id="headline"></div><div id="amount"></div><p id="detail"></p><a class="link" href="https://www.nps.or.kr/" target="_blank" rel="noopener noreferrer">국민연금공단 공식 홈페이지</a></section><footer><p>※ 앞서 안내한 제도 기준을 적용한 참고용 도구입니다. 실제 지원 자격과 신청 가능 여부는 국민연금공단에서 확인하세요. 41,000원은 2027년 1월 기준 예시이며 지원 시점에 따라 달라질 수 있습니다.</p><p>문의: 국민연금공단 1355 · <a href="https://www.law.go.kr/법령/국민연금법" target="_blank" rel="noopener noreferrer">국민연금법 확인</a></p><p>입력 정보는 외부로 전송하거나 저장하지 않습니다.</p></footer></main><script>
const year=document.getElementById('year');for(let y=2009;y<=2026;y++){year.add(new Option(y+'년생',y));}const qs=[['national','② 대한민국 국적을 가지고 있나요?','예','아니요'],['domestic','③ 현재 국내에 거주하고 있나요?','예','아니요'],['other','④ 다른 공적연금에 가입했나요?','예','아니요'],['paid','⑤ 국민연금 보험료 납부 이력이 있나요?','있음','없음']];for(const [name,title,yes,no] of qs){const f=document.createElement('fieldset');f.innerHTML=`<legend>${title}</legend><div class="choices"><label><input required type="radio" name="${name}" value="yes"> ${yes}</label><label><input type="radio" name="${name}" value="no"> ${no}</label></div>`;document.getElementById('questions').append(f)}const form=document.getElementById('check'),result=document.getElementById('result');form.addEventListener('change',()=>result.hidden=true);form.addEventListener('reset',()=>result.hidden=true);function assess(y,n,d,o,p){if(y==='old')return ['지원 대상에 해당하지 않습니다','','2008년 이전 출생자는 이번 제도의 적용 대상이 아닙니다.'];if(n==='no'||d==='no'||o==='yes')return ['지원 요건 확인이 필요합니다','','국적, 국내 거주 또는 다른 공적연금 가입 요건에 따라 지원이 제한될 수 있습니다.'];if(+y>2009)return [(+y+18)+'년 지원 대상 예정','','현행 제도가 유지될 경우 만 18세가 되는 해부터 지원 대상이 될 수 있습니다. 신청 공고를 확인하세요.'];return ['사전 신청 대상에 해당할 수 있습니다',p==='yes'?'가입기간 1개월 추가 인정':'41,000원 지원 (2027년 1월 기준)',p==='yes'?'기존 납부 이력에 따른 가입기간 추가 인정 여부를 공단에서 확인하세요.':'첫 1개월분 보험료 지원 대상 여부를 공단에서 확인하세요. 2027년 생일이 속한 달부터 지원 예정입니다.'];}form.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(form);const r=assess(year.value,f.get('national'),f.get('domestic'),f.get('other'),f.get('paid'));['headline','amount','detail'].forEach((id,i)=>document.getElementById(id).textContent=r[i]);result.hidden=false;result.focus();result.scrollIntoView({behavior:'smooth',block:'nearest'});});
</script></body></html>
